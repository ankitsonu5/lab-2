<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Service Cards - Access PathLab</title>
    <link rel="stylesheet" href="service.css">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Service Cards Section -->
    <section class="services-section">
        <div class="container">
            <div class="service-cards-grid">
                
                <!-- Lab Tests Card -->
                <div class="service-card yellow-card" data-service="lab-tests">
                    <div class="card-background-pattern">
                        <div class="pattern-circle-1"></div>
                        <div class="pattern-circle-2"></div>
                    </div>
                    
                    <div class="card-content">
                        <div class="card-header">
                            <h3 class="card-title">Book</h3>
                            <h4 class="card-subtitle">Lab Tests</h4>
                        </div>
                        
                        <div class="card-footer">
                            <div class="card-icon">
                                <i class="fas fa-vial test-tube-icon"></i>
                            </div>
                            <button class="card-arrow-btn">
                                <i class="fas fa-arrow-right"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Health Checks Card -->
                <div class="service-card orange-card" data-service="health-checks">
                    <div class="card-background-pattern">
                        <div class="pattern-circle-1"></div>
                        <div class="pattern-circle-2"></div>
                    </div>
                    
                    <div class="card-content">
                        <div class="card-header">
                            <h3 class="card-title">Popular</h3>
                            <h4 class="card-subtitle">Health Checks</h4>
                        </div>
                        
                        <div class="card-footer">
                            <div class="card-icon">
                                <i class="fas fa-stethoscope stethoscope-icon"></i>
                            </div>
                            <button class="card-arrow-btn">
                                <i class="fas fa-arrow-right"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- X-rays & MRI Card -->
                <div class="service-card purple-card" data-service="xrays-mri">
                    <div class="card-background-pattern">
                        <div class="pattern-circle-1"></div>
                        <div class="pattern-circle-2"></div>
                    </div>
                    
                    <div class="card-content">
                        <div class="card-header">
                            <h3 class="card-title">X-rays</h3>
                            <h4 class="card-subtitle">Scans & MRI</h4>
                        </div>
                        
                        <div class="card-footer">
                            <div class="card-icon">
                                <i class="fas fa-x-ray xray-icon"></i>
                            </div>
                            <button class="card-arrow-btn">
                                <i class="fas fa-arrow-right"></i>
                            </button>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </section>

    <script src="service.js"></script>
</body>
</html>
