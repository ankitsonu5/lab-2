<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Service Cards - Access PathLab</title>
    <link rel="stylesheet" href="service-cards.css">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Service Cards Section -->
    <section class="service-cards-section">
        <div class="container">
            <div class="service-cards-grid">

                <!-- Lab Tests Card - Yellow -->
                <div class="service-card yellow-gradient" data-service="lab-tests">
                    <div class="card-background-pattern">
                        <div class="pattern-circle-large"></div>
                        <div class="pattern-circle-small"></div>
                    </div>

                    <div class="card-content">
                        <div class="card-text-section">
                            <h3 class="card-title">Book</h3>
                            <h4 class="card-subtitle">Lab Tests</h4>
                        </div>

                        <div class="card-icon-section">
                            <i class="fas fa-vial card-icon"></i>
                        </div>
                    </div>
                </div>

                <!-- Health Checks Card - Orange -->
                <div class="service-card orange-gradient" data-service="health-checks">
                    <div class="card-background-pattern">
                        <div class="pattern-circle-large"></div>
                        <div class="pattern-circle-small"></div>
                    </div>

                    <div class="card-content">
                        <div class="card-text-section">
                            <h3 class="card-title">Popular</h3>
                            <h4 class="card-subtitle">Health Checks</h4>
                        </div>

                        <div class="card-icon-section">
                            <i class="fas fa-stethoscope card-icon"></i>
                        </div>
                    </div>
                </div>

                <!-- X-rays & MRI Card - Purple -->
                <div class="service-card purple-gradient" data-service="xrays-mri">
                    <div class="card-background-pattern">
                        <div class="pattern-circle-large"></div>
                        <div class="pattern-circle-small"></div>
                    </div>

                    <div class="card-content">
                        <div class="card-text-section">
                            <h3 class="card-title">X-rays</h3>
                            <h4 class="card-subtitle">Scans & MRI</h4>
                        </div>

                        <div class="card-icon-section">
                            <i class="fas fa-x-ray card-icon"></i>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </section>

    <script src="service-cards.js"></script>
</body>
</html>
