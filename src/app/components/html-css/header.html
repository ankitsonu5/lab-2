<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access PathLab - Header</title>
    <link rel="stylesheet" href="header.css">
</head>
<body>
    <header class="header">
        <div class="header-container">
            <div class="header-content">
                <!-- Logo -->
                <div class="logo-section">
                    <img src="/pathlab-logo.svg" alt="Access PathLab" class="logo">
                </div>

                <!-- Search Bar -->
                <div class="search-section">
                    <div class="search-container">
                        <div class="search-icon">
                            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                            </svg>
                        </div>
                        <input type="text" class="search-input" placeholder="Lab Tests, Scans & Health Checkup Packages">
                    </div>
                </div>

                <!-- Navigation -->
                <div class="nav-section">
                    <!-- Healthcare Services Dropdown -->
                    <div class="dropdown">
                        <button class="dropdown-btn" onclick="toggleDropdown()">
                            Healthcare Services
                            <svg class="dropdown-arrow" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                            </svg>
                        </button>
                        
                        <!-- Dropdown Menu -->
                        <div class="dropdown-menu" id="dropdownMenu">
                            <div class="dropdown-content">
                                <h3 class="dropdown-title">Our Services</h3>
                                <div class="services-grid">
                                    <button class="service-item" onclick="openBookingModal('Lab Tests')">
                                        <span class="service-icon">🧪</span>
                                        <span class="service-name">Lab Tests</span>
                                    </button>
                                    <button class="service-item" onclick="openBookingModal('Health Checkups')">
                                        <span class="service-icon">❤️</span>
                                        <span class="service-name">Health Checkups</span>
                                    </button>
                                    <button class="service-item" onclick="openBookingModal('X-rays & Scans')">
                                        <span class="service-icon">📷</span>
                                        <span class="service-name">X-rays & Scans</span>
                                    </button>
                                    <button class="service-item" onclick="openBookingModal('MRI Scans')">
                                        <span class="service-icon">🔬</span>
                                        <span class="service-name">MRI Scans</span>
                                    </button>
                                    <button class="service-item" onclick="openBookingModal('Blood Tests')">
                                        <span class="service-icon">🩸</span>
                                        <span class="service-name">Blood Tests</span>
                                    </button>
                                    <button class="service-item" onclick="openBookingModal('Urine Tests')">
                                        <span class="service-icon">🧪</span>
                                        <span class="service-name">Urine Tests</span>
                                    </button>
                                    <button class="service-item" onclick="openBookingModal('ECG')">
                                        <span class="service-icon">📈</span>
                                        <span class="service-name">ECG</span>
                                    </button>
                                    <button class="service-item" onclick="openBookingModal('Home Collection')">
                                        <span class="service-icon">🏠</span>
                                        <span class="service-name">Home Collection</span>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Offers -->
                    <div class="offers-badge">
                        🎯 Offers
                    </div>

                    <!-- Login -->
                    <button class="login-btn">
                        <svg class="login-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                        </svg>
                        Login
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Booking Modal -->
    <div class="modal-overlay" id="bookingModal">
        <div class="modal-content">
            <!-- Modal Header -->
            <div class="modal-header">
                <h2 class="modal-title">Book Your Test</h2>
                <button class="modal-close" onclick="closeBookingModal()">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>

            <!-- Modal Body -->
            <div class="modal-body">
                <p class="modal-subtitle">Fill the form below and we'll contact you</p>
                
                <form class="booking-form">
                    <div class="form-group">
                        <label class="form-label">Full Name *</label>
                        <input type="text" class="form-input" placeholder="Enter your full name" required>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">Phone Number *</label>
                        <input type="tel" class="form-input" placeholder="+91 98765 43210" required>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">Email Address</label>
                        <input type="email" class="form-input" placeholder="your.email@example.com">
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">Service Required *</label>
                        <select class="form-select" id="serviceSelect" required>
                            <option value="Lab Tests">Lab Tests</option>
                            <option value="Health Checkups">Health Checkups</option>
                            <option value="X-rays & Scans">X-rays & Scans</option>
                            <option value="MRI Scans">MRI Scans</option>
                            <option value="Blood Tests">Blood Tests</option>
                            <option value="Urine Tests">Urine Tests</option>
                            <option value="ECG">ECG</option>
                            <option value="Home Collection">Home Collection</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">Additional Message</label>
                        <textarea class="form-textarea" placeholder="Any specific requirements or questions..."></textarea>
                    </div>
                </form>

                <!-- Contact Options -->
                <div class="contact-options">
                    <p class="contact-title">Choose how to contact us:</p>
                    
                    <button class="contact-btn whatsapp-btn" onclick="sendWhatsApp()">
                        <svg fill="currentColor" viewBox="0 0 24 24">
                            <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893A11.821 11.821 0 0020.885 3.097"/>
                        </svg>
                        💬 Send via WhatsApp
                    </button>
                    
                    <button class="contact-btn call-btn" onclick="makeCall()">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" />
                        </svg>
                        📞 Call Now
                    </button>
                    
                    <button class="contact-btn close-btn" onclick="closeBookingModal()">
                        Close
                    </button>
                </div>

                <!-- Contact Info -->
                <div class="contact-info">
                    <p>
                        <strong>📞 Call:</strong> +91 98765 43210<br>
                        <strong>⏰ Timing:</strong> 24/7 Available<br>
                        <strong>🏠 Home Collection:</strong> Free
                    </p>
                </div>
            </div>
        </div>
    </div>

    <script src="header.js"></script>
</body>
</html>
